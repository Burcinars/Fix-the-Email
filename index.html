<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Fix the Email · Opening, body, closing, signature</title>
<style>
:root{
  --ink:#1F1B24;--ink2:#4A4550;--muted:#6B6570;
  --page:#FBF8F3;--card:#FFFFFF;--line:#E6DED3;--line2:#D6CCBF;
  --blue:#D4E8FA;--blueInk:#2F5E8F;--blueEdge:#7FAEDD;
  --mint:#D6F3E4;--mintInk:#2F6B4F;--mintEdge:#6FB592;
  --peach:#FFE1CF;--peachInk:#8A4B1C;--peachEdge:#E3A47A;
  --lav:#E6DDF8;--lavInk:#5C4A9E;--lavEdge:#A08BD6;
  --butter:#FFF2B8;--butterInk:#5C4600;--butterEdge:#D9B92A;
  --pink:#FFDCE8;--pinkInk:#8A2F55;--pinkEdge:#E79BB7;
  --peri:#DDE3FF;--periInk:#2F3F8A;--periEdge:#9FAEE8;
  --cream:#F3EEE3;--creamInk:#5A4A2F;--creamEdge:#CDBFA5;
  --note:#EEF1F5;--noteEdge:#A9B6C6;
  --r:18px;
  --shadow:0 1px 2px rgba(31,27,36,.06),0 8px 24px rgba(31,27,36,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:20px;line-height:1.6;letter-spacing:.005em;-webkit-font-smoothing:antialiased}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 .4em;letter-spacing:-.005em}
h1{font-size:38px}h2{font-size:30px}
p{margin:0 0 .7em}
b{font-weight:700}
button{font-family:inherit;color:inherit}
textarea,input{font-family:inherit}

/* top */
.top{position:sticky;top:0;z-index:40;background:var(--page);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces';font-weight:600;font-size:21px;line-height:1.15}
.brand small{display:block;font-family:'Hanken Grotesk';font-weight:600;font-size:14px;color:var(--ink2)}
.progress{flex:1;min-width:140px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;border-radius:999px;background:#E9E3DA;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mintInk);border-radius:999px;transition:width .4s ease}
.pcount{font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap}
.points{background:#FFF2B8;border:1.5px solid #E6CF6A;color:#5C4600;border-radius:999px;padding:3px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.points.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.modetag{font-size:13.5px;font-weight:600;color:var(--ink2);background:#EFEAE3;border-radius:999px;padding:3px 10px;white-space:nowrap}

/* page */
.wrap{max-width:860px;margin:0 auto;padding:22px 20px 160px}
#page{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lrow{font-size:21px}
.small{font-size:16px;color:var(--ink2)}
.band{border-radius:var(--r);padding:18px 22px 12px;margin:0 0 16px}
.band .kicker{font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:4px}
.band h1{margin-bottom:.2em}
.how{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.how ol,.how ul{margin:8px 0 0;padding-left:24px}
.how li{margin-bottom:6px}
.sticky{background:#FFF2B8;border:1.5px solid #E6CF6A;border-radius:6px;padding:14px 18px;font-size:21px;line-height:1.5;margin:0 0 16px;box-shadow:3px 4px 0 rgba(0,0,0,.08);position:relative;transform:rotate(-.6deg)}
.sticky .sig{display:block;font-weight:700;margin-top:6px;text-align:right}
.who{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14.5px;color:var(--ink2);margin-bottom:10px}
.plain{background:var(--note);border-left:8px solid var(--noteEdge);border-radius:14px;padding:12px 16px;margin:0 0 16px;font-size:19.5px}
.plain b{font-weight:800}

/* job box */
.job{background:var(--blue);border:2px solid var(--blueEdge);border-left:8px solid var(--blueInk);border-radius:16px;padding:12px 16px 12px;margin:0 0 16px}
.jobtitle{font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--blueInk);margin-bottom:4px}
.jobtext{font-size:20px;font-weight:700;line-height:1.4}
.jobnote{font-size:16.5px;color:var(--ink2);margin:6px 0 0}

/* email card */
.email{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 20px 16px;margin:0 0 16px;font-size:19px;line-height:1.5}
.email .hdr{font-size:16.5px;display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;align-items:start;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.email .lab{font-weight:800;color:var(--muted)}
.email p{margin:0 0 4px}
.blk{position:relative;transition:opacity .5s,background .5s;padding:6px 12px 6px 14px;margin:8px 0;border-left:6px solid transparent;border-radius:10px}
.blk.inl{margin:0;padding:2px 10px;display:block}
.blk.on{border-left-color:var(--c)}
.blk.lit{background:var(--cl)}
.blk.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--cl)}100%{background:transparent}}
.blk[data-c="peach"]{--c:var(--peachEdge);--ci:var(--peachInk);--cl:var(--peach)}
.blk[data-c="blue"]{--c:var(--blueEdge);--ci:var(--blueInk);--cl:var(--blue)}
.blk[data-c="lav"]{--c:var(--lavEdge);--ci:var(--lavInk);--cl:var(--lav)}
.blk[data-c="butter"]{--c:var(--butterEdge);--ci:var(--butterInk);--cl:var(--butter)}
.blk[data-c="pink"]{--c:var(--pinkEdge);--ci:var(--pinkInk);--cl:var(--pink)}
.blk[data-c="peri"]{--c:var(--periEdge);--ci:var(--periInk);--cl:var(--peri)}
.blk[data-c="cream"]{--c:var(--creamEdge);--ci:var(--creamInk);--cl:var(--cream)}
.pill{position:absolute;right:10px;top:-13px;font-size:14px;font-weight:800;background:var(--cl);border:1.5px solid var(--c);color:var(--ci);padding:1px 10px;border-radius:999px;white-space:nowrap;animation:rise .5s ease both}
.sent{transition:opacity .5s,background .5s;border-radius:6px}
.sent.tap{cursor:pointer;border-bottom:2px dashed var(--line2)}
.sent.tap:hover{background:#F1ECE4}
.sent.hit{background:var(--blue);box-shadow:0 0 0 4px var(--blue);border-bottom-color:transparent}
.sent.nope{background:var(--peach);box-shadow:0 0 0 4px var(--peach)}
.email[data-spot="opening"] .blk:not([data-blk="opening"]),
.email[data-spot="subject"] .blk:not([data-blk="subject"]),
.email[data-spot="sections"] .blk:not([data-blk^="sec"]),
.email[data-spot="sec0"] .blk:not([data-blk="sec0"]),
.email[data-spot="sec1"] .blk:not([data-blk="sec1"]),
.email[data-spot="closing"] .blk:not([data-blk="closing"]),
.email[data-spot="signature"] .blk:not([data-blk="signature"]){opacity:.32}
.email[data-spot="find"] .sent:not(.hit):not(.nope):not(.tap){opacity:.4}
.open-line{font-weight:700}
.h{font-weight:800;margin:0 0 2px}
.email ol,.email ul{margin:2px 0 4px 26px;padding:0}
.email li{margin:3px 0}
.email li::marker{font-weight:800}
.sig .name{font-weight:800}
.enter{animation:rise .55s ease both}
.lift{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.compare{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.compare .col{flex:1 1 320px;min-width:0}
.cap{font-weight:800;color:var(--ink2);font-size:15px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px 4px}
.compare .email{font-size:16.5px}

/* options */
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line2);border-radius:14px;padding:12px 16px;font-size:19px;line-height:1.4;cursor:pointer;box-shadow:var(--shadow);transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--ink)}
.opt:focus-visible{outline:3px solid var(--blueInk);outline-offset:2px}
.opt .L{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.opt.good{background:var(--mint);border-color:var(--mintEdge)}
.opt.good .L{background:var(--mintInk);border-color:var(--mintInk);color:#fff}
.opt.miss{background:var(--peach);border-color:var(--peachEdge);color:var(--peachInk)}
.opt.miss .L{border-color:var(--peachEdge);color:var(--peachInk)}
.opt[disabled]{cursor:default;opacity:.75}
.opt.good[disabled]{opacity:1}
.fb{border-radius:14px;padding:12px 16px;margin:0 0 14px;font-size:19px;line-height:1.5;animation:fade .3s ease}
.fb.good{background:var(--mint);border-left:8px solid var(--mintEdge)}
.fb.miss{background:var(--peach);border-left:8px solid var(--peachEdge)}
.fb.note{background:var(--note);border-left:8px solid var(--noteEdge)}
.btn{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:10px 22px;font-weight:700;font-size:19px;cursor:pointer;box-shadow:0 3px 0 var(--ink);line-height:1.2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.blue{background:var(--blueInk);border-color:var(--blueInk);color:#fff;box-shadow:0 3px 0 #1F4268}
.btn.soft{background:#F1EEEA;border-color:#C9BFB1;box-shadow:0 3px 0 #C9BFB1}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink2);padding-left:6px}
.btn.wide{display:block;width:100%;margin:8px 0}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;font-size:inherit;color:var(--blueInk)}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}

/* write */
.field{width:100%;font-size:19px;line-height:1.5;padding:10px 14px;border:2px solid var(--line2);border-radius:12px;background:#fff;color:var(--ink)}
.field:focus{outline:3px solid var(--blueEdge);border-color:var(--blueInk)}
textarea.field{min-height:150px;resize:vertical}
.wlab{display:block;font-weight:800;margin:14px 0 6px;font-size:18px}
.wlab span{font-weight:600;color:var(--ink2);font-size:16px}
.hint{font-size:16px;color:var(--ink2);margin:4px 0 0}
.checks{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;box-shadow:var(--shadow);margin:16px 0}
.checks .ct{font-weight:800;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:18px;line-height:1.4;border-top:1px solid var(--line)}
.ck .box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;margin-top:2px}
.ck.ok .box{background:var(--mintInk);border-color:var(--mintInk);color:#fff}
.ck.ok{color:var(--ink2)}
.facts{background:var(--butter);border-left:8px solid var(--butterEdge);border-radius:14px;padding:12px 16px;margin:0 0 14px}
.facts ul{margin:6px 0 0;padding-left:22px}
.facts li{margin:3px 0}
.bigscore{font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);margin:0 0 16px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--page);border-top:1px solid var(--line);z-index:45}
.nav-in{max-width:860px;margin:0 auto;padding:10px 20px;display:flex;gap:12px;align-items:center}
.navmsg{margin-left:auto;color:var(--ink2);font-size:16px;font-weight:700;text-align:right;line-height:1.3}
@media (max-width:480px){.navmsg{display:none}.nav-in{justify-content:space-between}h1{font-size:30px}}

/* sign in */
.modebox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.modebox.signed{background:var(--mint);border-color:var(--mintEdge)}
.modehead{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:26px;margin-bottom:10px}
.modenote{margin:4px 0 14px}
.signstep{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.stephead{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:8px;line-height:1.35}
.sn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blueInk);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.secrow{display:flex;gap:10px;flex-wrap:wrap}
.secbtn{flex:1 1 200px;text-align:left;background:#fff;border:2px solid var(--line2);border-radius:14px;padding:10px 14px;cursor:pointer;line-height:1.3}
.secbtn span{display:block;font-size:15px;color:var(--ink2);font-weight:600}
.secbtn.on{border-color:var(--blueInk);background:var(--blue)}
.secbtn[disabled]{cursor:default}
.err{color:#8A2F2F;font-weight:700;min-height:1.4em;margin-bottom:8px}
.confirm{background:var(--blue);border:2px solid var(--blueEdge);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.bigid{font-size:34px;font-weight:800;letter-spacing:.08em}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">✉️ <span>Fix the Email<small>Opening · body · closing · signature</small></span></div>
  <div class="progress"><div class="bar"><i id="barfill"></i></div><span class="pcount" id="pcount"></span></div>
  <span class="modetag" id="modetag" style="display:none"></span>
  <span class="points" id="points">0 points</span>
</div></header>
<main class="wrap"><div id="page"></div></main>
<nav class="nav" aria-label="Pages">
  <div class="nav-in">
    <button class="btn soft" type="button" id="back">‹ Back</button>
    <button class="btn blue" type="button" id="next">Next ›</button>
    <span class="navmsg" id="navmsg"></span>
  </div>
</nav>

<script>
/* ================= HELPERS ================= */
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function words(s){ var m = String(s).trim().match(/\S+/g); return m ? m.length : 0; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function onClick(sel, fn){ var el = $(sel); if (el) el.addEventListener('click', fn); }

/* ================= CLASS VERSION (recording) ================= */
var CONFIG = {
  ENDPOINT: 'https://script.google.com/macros/s/AKfycbz8sy_FMZsIJuAOQOtbmRqBn-P03bvZCW-Dev7BEBSWBblCSi0RF1CMTMS39JCzWvTgOQ/exec',
  SALT1: 'northline-ctstate-2026',
  ACTIVITY: 'FIX1',
  VERSION: 'fix1-2026-10-19a',
  SECTIONS: {'13046': {label:'CRN 13046', sub:'In person · Mon/Wed 12:30'}, '13901': {label:'CRN 13901', sub:'Live online · Mon/Wed 5:30'}}
};
var QS = (function(){ try { return new URLSearchParams(location.search); } catch(e){ return {get:function(){ return null; }}; } })();
if (QS.get('test') === '1') CONFIG.ACTIVITY += '-TEST';
var PRESET = CONFIG.SECTIONS[QS.get('s')] ? QS.get('s') : null;
var STORE_KEY = 'fixtheemail_' + CONFIG.ACTIVITY;
function newCls(){ return {mode:null, section:PRESET, h1:null, tail:'', code:'', recordId:null, startedAt:null, unverified:false, submitted:null, submitError:null, submitting:false}; }
function isClass(){ return !!(st && st.cls && st.cls.mode === 'class'); }
function save(){
  try { var o = {}; Object.keys(st).forEach(function(k){ if (k !== 'form' && k !== 'look') o[k] = st[k]; });
    sessionStorage.setItem(STORE_KEY, JSON.stringify({v:CONFIG.VERSION, st:o})); } catch(e){}
}
function restore(){
  try {
    var raw = sessionStorage.getItem(STORE_KEY); if (!raw) return false;
    var o = JSON.parse(raw);
    if (!o || o.v !== CONFIG.VERSION || !o.st || !o.st.pg || o.st.pg.length !== PAGES.length) return false;
    st = o.st; if (!st.cls) st.cls = newCls(); st.cls.submitting = false;
    if (st.view !== 'pages') st.view = 'pages';
    return true;
  } catch(e){ return false; }
}
function normalizeId(raw){ return String(raw || '').replace(/\D/g, ''); }
function normalizeCode(c){ return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function secLabel(s){ return CONFIG.SECTIONS[s] ? CONFIG.SECTIONS[s].label : String(s || ''); }
function shortId(h){ return h ? String(h).slice(0, 6).toUpperCase() : ''; }
function showNav(on){ var n = $('.nav'); if (n) n.style.display = on ? '' : 'none'; }
function modeTag(){ var t = $('#modetag'); if (!t) return; if (!st.cls.mode){ t.style.display = 'none'; return; } t.style.display = ''; t.textContent = isClass() ? 'Class version' : 'Practice'; }
async function sha256Hex(text){
  var buf = new TextEncoder().encode(text);
  var hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(function(b){ return b.toString(16).padStart(2, '0'); }).join('');
}
async function postOnce(payload, timeoutMs){
  var ctrl = new AbortController();
  var t = setTimeout(function(){ ctrl.abort(); }, timeoutMs || 60000);
  try {
    var res = await fetch(CONFIG.ENDPOINT, {method:'POST', body:JSON.stringify(payload), signal:ctrl.signal, credentials:'omit', cache:'no-store'});
    var text = await res.text();
    try { return JSON.parse(text); } catch(e){ return {ok:false, error:'bad_response'}; }
  } catch(e){ return {ok:false, error:(e && e.name === 'AbortError') ? 'timeout' : 'network'}; }
  finally { clearTimeout(t); }
}
async function post(payload, timeoutMs){
  var r = null;
  for (var a = 0; a < 3; a++){
    r = await postOnce(payload, timeoutMs || 60000);
    if (r && (r.ok || (r.error !== 'timeout' && r.error !== 'network' && r.error !== 'bad_response'))) return r;
    await new Promise(function(res){ setTimeout(res, 1200 + a * 800); });
  }
  return r;
}
function whoStrip(p){
  if (!isClass() || p.type === 'start') return '';
  var c = st.cls;
  return '<div class="who"><span>🎓 Class version · ' + esc(secLabel(c.section)) + ' · ID ending in <b>' + esc(c.tail) + '</b></span>' + (c.recordId ? '<span>Record ' + esc(shortId(c.recordId)) + '</span>' : '') + '</div>';
}
function modeBox(){
  var c = st.cls;
  if (c.mode === 'class') return '<div class="modebox signed"><b>✅ You are signed in.</b> ' + esc(secLabel(c.section)) + ' · ID ending in <b>' + esc(c.tail) + '</b>. Press <b>Next ›</b> at the bottom.</div>';
  if (c.mode === 'practice') return '<div class="modebox"><b>You are in practice mode.</b> Nothing is saved. Press <b>Next ›</b> at the bottom.' +
    '<p class="small" style="margin:10px 0 0">Need points? <button class="linkbtn" type="button" id="toClass">Switch to the class version</button> (this starts over from page 1).</p></div>';
  return '<div class="modebox">' +
    '<div class="modehead">Choose one</div>' +
    '<button class="btn blue wide" type="button" id="goClass">🎓 Class version (for points) ›</button>' +
    '<p class="small modenote">Use this in class. You need the <b>class code</b> your professor gives you. Your points and the email you write are saved for your professor.</p>' +
    '<button class="btn soft wide" type="button" id="goPractice">Practice only</button>' +
    '<p class="small modenote">Nothing is saved. No points count.</p>' +
    '<p class="small" style="margin:4px 0 0"><button class="linkbtn" type="button" id="goLookup">Already finished? Check that your result was saved.</button></p>' +
  '</div>';
}
function secButtons(locked){
  return '<div class="secrow">' + Object.keys(CONFIG.SECTIONS).map(function(k){ var s = CONFIG.SECTIONS[k], on = st.cls.section === k;
    return '<button type="button" class="secbtn' + (on ? ' on' : '') + '" data-sec="' + k + '" aria-pressed="' + on + '"' + (locked ? ' disabled' : '') + '><b>' + esc(s.label) + '</b><span>' + esc(s.sub) + '</span></button>'; }).join('') + '</div>';
}
function renderSignin(){
  showNav(false); modeTag();
  var f = st.form || (st.form = {id:'', code:'', confirm:false, err:''});
  var h = '<h1>Class version: sign in</h1>' +

  nav(); modeTag(); save();
  var em = $('#em'); if (em) lightUp(em, p.spot);
  playLift();
}
function bumpPoints(){ var el = $('#points'); if (!el) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function bind(p, s){
  if (p.type === 'start'){
    onClick('#goClass', function(){ st.view = 'signin'; st.form = null; render(); });
    onClick('#goPractice', function(){ st.cls = newCls(); st.cls.mode = 'practice'; go(1); });
    onClick('#goLookup', function(){ st.view = 'lookup'; st.look = null; render(); });
    onClick('#toClass', function(){ fresh(); st.view = 'signin'; render(); });
  }
  if (p.type === 'check' && p.tapAsk && !s.done){
    $$('#em .sent').forEach(function(el){
      el.classList.add('tap');
      el.addEventListener('click', function(){
        if (s.done) return;
        s.tries = (s.tries || 0) + 1;
        var right = el.classList.contains('ask');
        if (right){
          s.done = true; if (s.firstTry == null) s.firstTry = 1;
          $$('#em .sent').forEach(function(x){ x.classList.remove('tap', 'nope'); });
          el.classList.add('hit');
          s.fb = '<div class="fb good">' + p.good + '</div>';
        } else {
          if (s.firstTry == null) s.firstTry = 0;
          el.classList.remove('tap'); el.classList.add('nope');
          s.fb = '<div class="fb miss">' + p.miss + '</div>';
        }
        $('#fbzone').innerHTML = s.fb; nav(); save();
      });
    });
  }
  if (p.opts && !s.done){
    $$('.opt').forEach(function(b){
      b.addEventListener('click', function(){
        if (s.done) return;
        var k = +b.dataset.k, o = p.opts[k];
        s.tries = (s.tries || 0) + 1;
        if (o.ok){
          s.done = true; if (s.firstTry == null) s.firstTry = 1;
          s.fb = '<div class="fb good"><b>✅ ' + (p.type === 'decide' ? '1 point. ' : '') + '</b>' + esc(o.why) + '</div>';
          if (p.type === 'decide'){ s.points = p.pts; bumpPoints(); }
          render();
          if (p.type === 'decide'){
            var em = $('#em'); var keys = {subject:['subject'], opening:['opening'], headers:['sec0', 'sec1'], lists:['sec0', 'sec1'], closing:['closing', 'signature']}[p.fix];
            if (em) flash(em, keys);
            if (p.fix === 'opening') { /* already rendered; show a settle animation */ var ol = $('.open-line'); if (ol){ ol.classList.add('enter'); } }
          }
        } else {
          if (s.firstTry == null) s.firstTry = 0;
          s.wrong = (s.wrong || []).concat([k]);
          s.fb = '<div class="fb miss"><b>Not that one.</b> ' + esc(o.why) + ' Pick again.</div>';
          b.classList.add('miss'); b.disabled = true;
          $('#fbzone').innerHTML = s.fb; save();
        }
      });
    });
  }
  if (p.type === 'write' && !s.w.locked){
    var w = s.w;
    var upd = function(){
      w.subject = $('#wsub').value; w.opening = $('#wopen').value; w.body = $('#wbody').value; w.closing = $('#wclose').value; w.signature = $('#wsig').value;
      $('#ckwrap').innerHTML = checksHTML(w);
      $('#lockBtn').disabled = !runChecks(w).all;
      save();
    };
    ['#wsub', '#wopen', '#wbody', '#wclose', '#wsig'].forEach(function(id){ $(id).addEventListener('input', upd); });
    onClick('#lockBtn', function(){
      upd(); if (!runChecks(w).all) return;
      if (!confirm('Lock in your email? You cannot change it after this.')) return;
      w.locked = true; s.done = true; s.points = p.pts; bumpPoints(); render(); window.scrollTo(0, 0);
    });
  }
  if (p.type === 'end'){ onClick('#restart', function(){ fresh(); render(); }); }
}
function canNext(){
  var p = PAGES[st.i], s = st.pg[st.i];
  if (p.type === 'start') return !!st.cls.mode;
  if (p.type === 'check' || p.type === 'decide' || p.type === 'write') return !!s.done;
  if (p.type === 'end') return false;
  return true;
}
function nav(){
  var p = PAGES[st.i];
  var back = $('#back'), next = $('#next'), msg = $('#navmsg');
  back.disabled = st.i === 0 || p.type === 'end';
  next.disabled = !canNext();
  next.textContent = p.type === 'write' ? 'Finish ›' : 'Next ›';
  if (p.type === 'start') msg.innerHTML = st.cls.mode ? 'Press Next to begin' : 'Choose a version above to begin';
  else if (p.type === 'check') msg.innerHTML = st.pg[st.i].done ? 'Good. Press Next.' : (p.tapAsk ? 'Tap the sentence in the email' : 'Answer the question to continue');
  else if (p.type === 'decide') msg.innerHTML = st.pg[st.i].done ? 'Fixed. Press Next.' : 'Pick the best option';
  else if (p.type === 'write') msg.innerHTML = st.pg[st.i].done ? 'Press Finish to save' : 'Lock in your email first';
  else if (p.type === 'end') msg.innerHTML = '';
  else msg.innerHTML = 'Press Next when you are ready';
  var done = st.i, totalPages = PAGES.length - 1;
  $('#barfill').style.width = Math.round(100 * done / totalPages) + '%';
  $('#pcount').textContent = 'Page ' + (st.i + 1) + ' of ' + PAGES.length;
  $('#points').textContent = total() + ' of ' + MAXPTS + ' points';
}
function go(i){
  if (i < 0 || i >= PAGES.length) return;
  var p = PAGES[i];
  if (p.type === 'check' && p.lift) liftFrom = captureAsk(); else liftFrom = null;
  st.i = i; st.view = 'pages';
  render();
  window.scrollTo(0, 0);
  if (liftFrom) playLift();
}
$('#next').addEventListener('click', function(){ if (canNext()) go(st.i + 1); });
$('#back').addEventListener('click', function(){ if (st.i > 0) go(st.i - 1); });

/* ================= BOOT ================= */
fresh();
if (!restore()) fresh();
render();
window.__fix = {st:function(){ return st; }, go:go, PAGES:PAGES, MAXPTS:MAXPTS, CONFIG:CONFIG, runChecks:runChecks};
</script>
</body>
</html>
